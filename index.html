 el.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.onchange=function(){var s=store('ck_'+AGE)||{};s[cb.dataset.id]=cb.checked;store('ck_'+AGE,s);var n=el.querySelectorAll('input:checked').length;var p=Math.round(n/tot*100);$('wn-pc').textContent=p+'%';$('wn-bar').style.width=p+'%'}});
 var rs=$('wn-reset');if(rs)rs.onclick=function(){store('ck_'+AGE,{});showRes()}}
function renderHome(){var T=I[L];$('p-home').innerHTML='<h3>'+T.h1+'</h3><p>'+T.h2+'</p><h3>'+T.h3+'</h3><div class="grid"><div class="card"><div class="big">1</div>'+T.s1+'</div><div class="card"><div class="big">2</div>'+T.s2+'</div><div class="card"><div class="big">3</div>'+T.s3+'</div></div><p><button class="btn" id="wn-go">'+T.hb+'</button></p><div class="note">'+T.priv+'</div>';$('wn-go').onclick=function(){tab('child')}}
function renderProg(){var T=I[L];$('p-prog').innerHTML='<h3>'+T.pg+'</h3><div class="grid"><div class="card"><b>'+T.pg1+'</b><br>'+T.pg1t+'</div><div class="card"><b>'+T.pg2+'</b><br>'+T.pg2t+'</div><div class="card"><b>'+T.pg3+'</b><br>'+T.pg3t+'</div><div class="card"><b>'+T.pg4+'</b><br>'+T.pg4t+'</div></div><h3>'+T.fmt+'</h3><div class="card"><ul><li>'+T.fmt1+'</li><li>'+T.fmt2+'</li><li>'+T.fmt3+'</li><li>'+T.fmt4+'</li></ul></div><h3>'+T.ij+'</h3><p>'+documentLink('materiali/programma-ijtema-2026.pdf',IJTEMA_PROGRAM[L])+'</p>'}

function renderQuiz(){var T=I[L],qq=Q[L],h='<h3>'+T.quiz+'</h3><p>'+T.quiz0+'</p><div id="wn-q"></div><h3>'+T.faq+'</h3>';
 FAQ[L].forEach(function(f){h+='<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>'});$('p-quiz').innerHTML=h;qi=0;qs=0;drawQ()}
function drawQ(){var T=I[L],qq=Q[L],el=$('wn-q');if(qi>=qq.length){el.innerHTML='<div class="card"><div class="big">'+T.score+qs+' / '+qq.length+'</div><p><button class="btn" id="wn-qa">'+T.again+'</button></p></div>';$('wn-qa').onclick=function(){qi=0;qs=0;drawQ()};return}
 var q=qq[qi];el.innerHTML='<div class="card"><p><b>'+(qi+1)+'/'+qq.length+'</b> · '+q[0]+'</p>'+q[1].map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>'}).join('')+'<p id="wn-nx"></p></div>';
 el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(el.dataset.done==qi)return;el.dataset.done=qi;var ok=+b.dataset.i===q[2];if(ok)qs++;b.classList.add(ok?'ok':'no');if(!ok)el.querySelector('[data-i="'+q[2]+'"]').classList.add('ok');$('wn-nx').innerHTML='<button class="btn" id="wn-n">'+T.next+'</button>';$('wn-n').onclick=function(){qi++;drawQ()}}})}
function renderTeach(){var T=I[L];$('p-teach').innerHTML='<h3>'+T.tc+'</h3><p>'+T.tc0+'</p><h3>'+T.r0+'</h3><div class="card"><ol><li>'+T.r1+'</li><li>'+T.r2+'</li><li>'+T.r3+'</li><li>'+T.r4+'</li></ol></div><h3>'+T.mk+'</h3><table><tr><td>'+T.m4+'</td></tr><tr><td>'+T.m3+'</td></tr><tr><td>'+T.m2+'</td></tr><tr><td>'+T.m1+'</td></tr><tr><td>'+T.m0+'</td></tr></table><h3>'+T.rl+'</h3><div class="card"><ul><li>'+T.rl1+'</li><li>'+T.rl2+'</li><li>'+T.rl3+'</li></ul></div>'}
var IDS=['home','child','prog','jaiza','quiz','teach'];
function tab(id){TAB=id;IDS.forEach(function(x){$('p-'+x).classList.toggle('on',x===id)});document.querySelectorAll('#wn-tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===id)});if(id==='child')renderChild();root.scrollIntoView&&0}
function cd(){var T=I[L],n=Math.ceil((IJTEMA-new Date(new Date().toDateString()))/864e5);$('wn-cd').textContent=n>0?T.cd0+n+T.cdd:n===0?T.cdt:T.cdp}
function setL(l){L=l;root.className='wn'+(l==='ur'?' ur':'');root.lang=l;root.dir=l==='ur'?'rtl':'ltr';var T=I[l];
 root.querySelector('[data-i=title]').textContent=T.title;root.querySelector('[data-i=sub]').textContent=T.sub;
 $('wn-tabs').innerHTML=IDS.map(function(x,i){return '<button data-t="'+x+'">'+T.tabs[i]+'</button>'}).join('');
 $('wn-tabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){tab(b.dataset.t)}});
 root.querySelectorAll('.lg button').forEach(function(b){b.classList.toggle('on',b.dataset.l===l)});
 renderHome();renderProg();renderJaiza();renderQuiz();renderTeach();cd();tab(TAB);try{history.replaceState(null,'','#'+l)}catch(e){}}
root.querySelectorAll('.lg button').forEach(function(b){b.onclick=function(){setL(b.dataset.l)}});
var h=(location.hash||'').slice(1);AGE=store('age');
setL(['it','en','ur'].indexOf(h)>-1?h:'it');
})();
